name: Build and Test Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded Android project
        run: unzip -o project.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akudama-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK build tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Akudama-APK
          path: apk

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            mkdir -p test-results
            APK=$(find apk -type f -name '*.apk' | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
            test -n "$PACKAGE"
            echo "Package: $PACKAGE"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 | tee test-results/launch.txt
            sleep 8
            adb shell pidof "$PACKAGE" | tee test-results/pid.txt
            adb exec-out screencap -p > test-results/screenshot.png
            adb logcat -d -v time > test-results/logcat.txt
            if grep -A 25 'FATAL EXCEPTION' test-results/logcat.txt | grep -F "Process: $PACKAGE,"; then
              echo "Application crashed during smoke test"
              exit 1
            fi
            echo "Smoke test passed: $PACKAGE"

      - name: Save emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Emulator-Diagnostics
          path: test-results/
          if-no-files-found: ignore
