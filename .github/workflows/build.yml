name: Build and Test Android APK

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name (legacy or folder name under projects/)'
        required: true
        default: 'dungeon'
        type: string
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'tests/**'
      - 'projects/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: ${{ github.event.inputs.project || 'dungeon' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded Android project
        run: |
          [[ "$PROJECT" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          if [ "$PROJECT" = legacy ]; then
            unzip -o project.zip -d .
          elif [ -f "projects/$PROJECT/project.zip" ]; then
            unzip -o "projects/$PROJECT/project.zip" -d .
          elif [ -f "projects/$PROJECT/settings.gradle" ]; then
            cp -a "projects/$PROJECT/." .
          else
            echo "::error::Project $PROJECT not found"; exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build-results
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build-results/build.log

      - name: Summarize build diagnostics
        if: always()
        run: python3 .github/scripts/build-report.py

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Akudama-Build-Diagnostics-${{ github.event.inputs.project || 'dungeon' }}
          path: build-results/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akudama-APK-${{ github.event.inputs.project || 'dungeon' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT: ${{ github.event.inputs.project || 'dungeon' }}
      TEST_CONFIG: tests/${{ github.event.inputs.project || 'dungeon' }}.json
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK build tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Akudama-APK-${{ github.event.inputs.project || 'dungeon' }}
          path: apk

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/test-emulator.sh

      - name: Save emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Emulator-Diagnostics-${{ github.event.inputs.project || 'dungeon' }}
          path: test-results/
          if-no-files-found: ignore
